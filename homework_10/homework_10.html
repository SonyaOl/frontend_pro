<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script>
        let company = {
            sales: [{
                name: 'John',
                salary: 1000
            }, {
                name: 'Alice',
                salary: 600
            }],
            development: {
                web: [{
                    name: 'Peter',
                    salary: 2000
                }, {
                    name: 'Alex',
                    salary: 1800
                }],
                internals: [{
                    name: 'Jack',
                    salary: 1300
                }]
            }
        };


        function sumSalaries(node) {
            if (Array.isArray(node)) {
                return node.reduce((acc, person) => acc + person.salary, 0);
            }
            return Object.values(node).reduce((acc, subdep) => acc + sumSalaries(subdep), 0);
        }

        console.log(sumSalaries(company)); // 6700
    </script>

</body>

</html>
